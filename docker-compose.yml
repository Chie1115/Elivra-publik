services:
  elivra-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=outside"
      - "traefik.http.routers.elivra-web.rule=Host(`demo.elivra.se`)"
      - "traefik.http.routers.elivra-web.entryPoints=web-secure"
      - "traefik.http.routers.elivra-web.tls=true"
      - "traefik.http.routers.elivra-web.tls.certResolver=elivraresolver"
      - "traefik.http.routers.elivra-web.service=elivra-web"
      - "traefik.http.services.elivra-web.loadBalancer.server.port=3000"
    environment:
      - NODE_ENV=production
      - VITE_APP_TITLE=${VITE_APP_TITLE:-Elivra}
      - VITE_APP_LOGO=${VITE_APP_LOGO:-/logo.png}
      - VITE_ANALYTICS_ENDPOINT=${VITE_ANALYTICS_ENDPOINT:-}
      - VITE_ANALYTICS_WEBSITE_ID=${VITE_ANALYTICS_WEBSITE_ID:-}
    # Optional: Mount volume for logs
    # volumes:
    #   - ./logs:/app/logs
#    healthcheck:
#      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
#      interval: 30s
#      timeout: 3s
#      retries: 3
#      start_period: 10s
    networks:
      - outside
      - elivra-network

networks:
  outside:
    external: true
  elivra-network:
    driver: bridge
